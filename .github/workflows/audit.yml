name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit locked dependencies against current advisories
        run: cargo audit
