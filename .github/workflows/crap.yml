name: CRAP gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  crap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install isolated Codex fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap strace
          profile_dir="$(mktemp -d "$RUNNER_TEMP/herdr-apparmor.XXXXXX")"
          (
            cd "$profile_dir"
            apt-get download apparmor-profiles
            dpkg-deb -x apparmor-profiles_*.deb extracted
          )
          sudo apparmor_parser -r "$profile_dir/extracted/usr/share/apparmor/extra-profiles/bwrap-userns-restrict"
          /usr/bin/bwrap --unshare-user --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov
      - name: Check absolute CRAP
        run: |
          cargo llvm-cov --locked --json --output-path "$RUNNER_TEMP/herdr-crap-coverage.json"
          cargo run --locked -- crap --all --threshold 10 --no-baseline --coverage "$RUNNER_TEMP/herdr-crap-coverage.json"
