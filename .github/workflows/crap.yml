name: CRAP gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  crap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Check absolute CRAP
        run: cargo run --locked -- crap --all --threshold 10 --no-baseline
