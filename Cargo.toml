[package]
name = "herdr-flow"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Bounded agent sessions, durable handoffs, and read-only CI observation for Herdr"
readme = "README.md"

[dependencies]
libc = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
syn = { version = "2", features = ["full", "visit"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
forbidden_lint_groups = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = "forbid"
type_complexity = "forbid"
